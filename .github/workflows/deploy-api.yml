name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Подготовить SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Скопировать сервер
        run: |
          rsync -az --delete \
            --exclude 'data' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            server/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/pomogator/server/"

      - name: Перезапустить сервис
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo systemctl restart pomogator-api && sudo systemctl is-active pomogator-api"
