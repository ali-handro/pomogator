<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>Suflyor — запись встречи</title>
    <link rel="stylesheet" href="meeting.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="dot" id="dot"></span>
        <span id="title">Запись встречи</span>
      </div>
      <button class="icon" id="btnClose" title="Закрыть">✕</button>
    </header>

    <section class="controls">
      <button type="button" class="record" id="btnRecord">
        <span class="rec-icon"></span>
        <span id="recordLabel">Записать</span>
      </button>

      <div class="timer" id="timer">00:00</div>

      <label class="field">
        <span class="label">Распознавание</span>
        <select id="engine">
          <option value="local">Локально (whisper.cpp)</option>
          <option value="whisper">Whisper (Cloudflare)</option>
        </select>
      </label>

      <div class="levels">
        <div class="level-row">
          <span class="level-name">Вы</span>
          <div class="level"><span id="levelMe"></span></div>
        </div>
        <div class="level-row">
          <span class="level-name">Собеседник</span>
          <div class="level"><span id="levelThem"></span></div>
        </div>
      </div>
    </section>

    <main class="transcript-wrap">
      <div class="transcript" id="transcript">
        <p class="empty" id="empty">
          Нажмите «Записать» — Суфлёр запишет микрофон и звук системы, а здесь появится
          расшифровка с разделением на вас и собеседника. Аудио нигде не сохраняется.
        </p>
      </div>
    </main>

    <footer class="foot">
      <span class="status" id="status"></span>
      <div class="actions">
        <button type="button" class="ghost" id="btnSummary" disabled>Сделать выжимку</button>
        <button type="button" class="ghost" id="btnExport" disabled>Экспорт .md</button>
        <button type="button" class="ghost" id="btnClear" disabled>Очистить</button>
      </div>
    </footer>

    <script src="meeting.js"></script>
  </body>
</html>
