<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>Помогатор — вход</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <span class="logo"></span>
        <div>
          <h1>Вход в Помогатор</h1>
          <p>Для облачных ответов и баланса</p>
        </div>
      </header>

      <section class="step" id="stepEmail">
        <label class="field">
          <span class="label">Почта</span>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            spellcheck="false"
            autocomplete="email"
          />
        </label>
        <button type="button" class="primary" id="sendCode">Получить код</button>
        <p class="hint">Пришлём 6 цифр. Пароль не нужен.</p>
      </section>

      <section class="step" id="stepCode" hidden>
        <p class="sent">Код отправлен на <b id="sentTo"></b></p>
        <label class="field">
          <span class="label">Код из письма</span>
          <input
            id="code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
          />
        </label>
        <button type="button" class="primary" id="verify">Войти</button>
        <button type="button" class="link" id="back">Изменить почту</button>
      </section>

      <div class="status" id="status"></div>

      <footer class="foot">
        <span id="deviceName"></span>
      </footer>
    </div>

    <script src="login.js"></script>
  </body>
</html>
